[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cocapn-lessons"
version = "3.1.0"
description = "Trial-based learning for distributed agent fleets — O(1/n) failure rate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["flux", "vm", "agent", "learning", "trials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
cocapn-lessons = "cocapn_lessons:main"

[tool.hatch.build.targets.wheel]
packages = ["cocapn_lessons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
